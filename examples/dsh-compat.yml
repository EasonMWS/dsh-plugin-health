# Drop this file into a DSH plugin repository as
# .github/workflows/dsh-compat.yml to get a compatibility matrix comment on every pull request.
name: dsh plugin compatibility

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  matrix:
    uses: EasonMWS/dsh-plugin-health/.github/workflows/matrix-review.yml@v0.1.3
    with:
      plugins: '.'
      versions: 'latest,next,alpha'
      failOn: 'none'
      comment: true
