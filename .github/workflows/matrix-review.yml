name: dsh plugin compatibility matrix

on:
  workflow_call:
    inputs:
      plugins:
        description: Plugin specs to evaluate (local directory, npm name, or name@version)
        required: false
        default: '.'
      versions:
        description: Comma-separated DSH host versions or dist-tags
        required: false
        default: 'latest,next,alpha'
      fail-on:
        description: any, none, or one host version; fails the job when incompatibilities are found
        required: false
        default: 'none'
      tool-version:
        description: dsh-plugin-health version to run
        required: false
        default: '0.1.3'
      comment:
        description: Post or update the matrix comment on the pull request
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  matrix:
    name: dsh plugin compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build matrix
        run: |
          npx -y "dsh-plugin-health@${{ inputs.tool-version }}" matrix \
            --plugins "${{ inputs.plugins }}" \
            --versions "${{ inputs.versions }}" \
            --out dsh-health-out/matrix \
            --fail-on "${{ inputs.fail-on }}"
      - name: Add matrix to job summary
        run: |
          cat dsh-health-out/matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on pull request
        if: ${{ inputs.comment && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- dsh-plugin-health-matrix -->'
            const body = `${marker}\n${fs.readFileSync('dsh-health-out/matrix/matrix.md', 'utf8')}\n\n_Generated by [dsh-plugin-health](https://github.com/EasonMWS/dsh-plugin-health)._`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-plugin-health-matrix
          path: dsh-health-out/matrix
