name: dsh plugin compatibility matrix

on:
  workflow_call:
    inputs:
      plugins:
        description: Plugin specs to evaluate (local directory, npm name, or name@version)
        required: false
        type: string
        default: '.'
      versions:
        description: Comma-separated DSH host versions or dist-tags
        required: false
        type: string
        default: 'latest,next,alpha'
      failOn:
        description: any, none, or one host version; fails the job when incompatibilities are found
        required: false
        type: string
        default: 'none'
      toolVersion:
        description: dsh-plugin-health version to run
        required: false
        type: string
        default: '0.1.5'
      comment:
        description: Post or update the matrix comment on the pull request
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  matrix:
    name: dsh plugin compatibility matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dsh-plugin-health
        env:
          TOOL_VERSION: ${{ inputs.toolVersion }}
        run: |
          TOOL_DIR="$RUNNER_TEMP/dsh-plugin-health-tool"
          npm install --prefix "$TOOL_DIR" --no-audit --no-fund --no-progress "dsh-plugin-health@$TOOL_VERSION"
          echo "TOOL_BIN=$TOOL_DIR/node_modules/.bin/dsh-plugin-health" >> "$GITHUB_ENV"
      - name: Build matrix
        run: |
          "$TOOL_BIN" matrix \
            --plugins "${{ inputs.plugins }}" \
            --versions "${{ inputs.versions }}" \
            --out dsh-health-out/matrix \
            --fail-on "${{ inputs.failOn }}"
      - name: Add matrix to job summary
        run: |
          cat dsh-health-out/matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            {
              echo ""
              echo "> This pull request comes from a fork, so its token is read-only and the"
              echo "> workflow cannot post the matrix as a PR comment. It is shown above in"
              echo "> this job summary and attached as the \`dsh-plugin-health-matrix\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Comment on pull request
        # Pull requests from forks get a read-only GITHUB_TOKEN no matter what
        # `permissions:` asks for, so posting a comment would always fail with
        # "Resource not accessible by integration". Skip it there: the matrix is
        # still in the job summary and in the uploaded artifact.
        if: ${{ inputs.comment && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- dsh-plugin-health-matrix -->'
            const body = `${marker}\n${fs.readFileSync('dsh-health-out/matrix/matrix.md', 'utf8')}\n\n_Generated by [dsh-plugin-health](https://github.com/EasonMWS/dsh-plugin-health)._`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-plugin-health-matrix
          path: dsh-health-out/matrix
