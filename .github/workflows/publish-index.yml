name: publish-index

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of npm plugins to include
        required: false
        default: '300'
      scanLimit:
        description: How many plugins to check for compatibility (0 = every npm plugin)
        required: false
        default: '0'
      host:
        description: Host version label for compatibility labels (empty = resolve npm latest)
        required: false
        default: ''
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build index and compatibility page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # A hard-coded label goes stale within days and silently mislabels the whole index, so the
      # host version is resolved from npm at build time unless the caller pinned one.
      # Inputs reach scripts through env, never interpolated into the script text.
      - name: Resolve host version
        id: host
        env:
          HOST_INPUT: ${{ inputs.host }}
        run: |
          if [ -n "$HOST_INPUT" ]; then
            echo "version=$HOST_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"
          fi

      # npm entries by package name; entries that only exist on GitHub as github:owner/repo, judged from the
      # package.json on their default branch (read, never run). Repositories without one are dropped by the matrix.
      - name: Collect plugin list
        run: |
          mkdir -p dsh-health-out
          node -e '
            const fs = require("fs");
            const get = async (url) => (await fetch(url)).json();
            get("https://awesome-dsh-plugin.com/plugins.json").then((catalog) => {
              const npm = catalog.plugins.map((p) => p.npm).filter(Boolean);
              const github = catalog.plugins
                .filter((p) => !p.npm && typeof p.url === "string")
                .map((p) => /^https:\/\/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)\/?$/.exec(p.url))
                .filter(Boolean)
                .map((m) => `github:${m[1]}/${m[2]}`);
              const limit = Number(process.env.SCAN_LIMIT || 0);
              const all = [...new Set([...npm, ...github])];
              const list = limit > 0 ? all.slice(0, limit) : all;
              fs.writeFileSync("dsh-health-out/scan-plugins.txt", list.join("\n") + "\n");
              fs.writeFileSync("dsh-health-out/catalog.json", JSON.stringify(catalog));
              console.log(`collected ${npm.length} npm plugins and ${github.length} GitHub-only entries`);
            });
          '
        env:
          SCAN_LIMIT: ${{ inputs.scanLimit || '0' }}

      # Boot-test evidence and the verdict history live on the verify-data branch. Read-only here; a separate
      # job below writes today's history snapshot back.
      - name: Read the data branch
        run: |
          if git fetch --depth 1 origin verify-data 2>/dev/null; then
            git worktree add data FETCH_HEAD
          else
            mkdir -p data
          fi
          mkdir -p data/history

      # Every row of the compatibility table comes from here: one registry or raw.githubusercontent lookup per
      # entry, 16 at a time. Writing to a subdirectory keeps it from overwriting the index landing page.
      #
      # `current` asks the matrix to choose the hosts itself: latest, any dist-tag that points ahead of
      # latest, and the previous minor line. Naming `next,alpha` by hand went wrong on 2026-11-08, when
      # `alpha` pointed at a release five days older than `latest` and 135 plugins were counted as
      # rejected by a host nobody runs.
      - name: Compatibility matrix
        env:
          LATEST: ${{ steps.host.outputs.version }}
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json
        run: |
          mkdir -p site/compat
          verify=()
          if [ -f "data/verify/$LATEST/verify.json" ]; then
            verify=(--verify "data/verify/$LATEST/verify.json" --verify-base "../verify/$LATEST/")
            mkdir -p site/verify && cp -r "data/verify/$LATEST" "site/verify/$LATEST"
          fi
          node bin/dsh-plugin-health.js matrix \
            --plugins dsh-health-out/scan-plugins.txt \
            --versions current \
            --out site/compat \
            --concurrency 16 \
            --no-badges \
            --fail-on none \
            --catalog dsh-health-out/catalog.json \
            --history data/history \
            "${verify[@]}" \
            --index-url "$INDEX_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: verdict-history
          path: data/history
          retention-days: 7

      - name: Build index
        env:
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json
          LIMIT: ${{ inputs.limit || '300' }}
          HOST: ${{ steps.host.outputs.version }}
        run: |
          node bin/dsh-plugin-health.js index \
            --catalog https://awesome-dsh-plugin.com/plugins.json \
            --host "$HOST" \
            --index-url "$INDEX_URL" \
            --limit "$LIMIT" \
            --out site

      # The one thing standing between a working site and a findable one. Without a sitemap, a search
      # engine has to discover 4,389 compatibility rows by following links; with one it is told, once.
      - name: Publish crawl metadata
        env:
          ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          node -e '
            const fs = require("fs");
            const origin = process.env.ORIGIN;
            const today = new Date().toISOString().slice(0, 10);
            const urls = [
              { loc: `${origin}/`, priority: "1.0", freq: "daily" },
              { loc: `${origin}/compat/`, priority: "0.9", freq: "daily" },
              // Machine-readable entry points. Lower priority, but they are the reason a plugin author
              // links here instead of copying a table.
              { loc: `${origin}/index.json`, priority: "0.6", freq: "daily" },
              { loc: `${origin}/compat/matrix.json`, priority: "0.6", freq: "daily" },
            ];
            const body = urls.map((u) =>
              `  <url>\n    <loc>${u.loc}</loc>\n    <lastmod>${today}</lastmod>\n`
              + `    <changefreq>${u.freq}</changefreq>\n    <priority>${u.priority}</priority>\n  </url>`
            ).join("\n");
            fs.writeFileSync("site/sitemap.xml",
              `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${body}\n</urlset>\n`);
            fs.writeFileSync("site/robots.txt",
              `User-agent: *\nAllow: /\n\nSitemap: ${origin}/sitemap.xml\n`);
            console.log("wrote sitemap.xml and robots.txt");
          '

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const m = JSON.parse(require("fs").readFileSync("site/compat/matrix.json", "utf8"));
            const hosts = m.hosts.join(", ");
            const bad = m.plugins.filter((p) => (p.summary && p.summary.incompatible) > 0).length;
            console.log(`- ${m.plugins.length} plugins checked against ${hosts}`);
            console.log(`- ${bad} have at least one host that rejects them`);
            console.log(`- page: compat/`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
  # The history is the one part of this data nobody can recreate later, so it is kept on a branch rather than
  # only in a Pages deployment that each run replaces. This job writes it back; it runs no plugin code and only
  # commits JSON the build job produced.
  record-history:
    name: keep the verdict history
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: verify-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verdict-history
          path: history-new
      - name: Commit to verify-data
        run: |
          if git fetch --depth 1 origin verify-data; then
            git worktree add data FETCH_HEAD
            git -C data checkout -B verify-data
          else
            git worktree add --orphan -b verify-data data
          fi
          # Only snapshot JSON and the events file are accepted from the artifact.
          mkdir -p data/history/snapshots
          find history-new/snapshots -maxdepth 1 -type f -name '20[0-9][0-9]-[01][0-9]-[0-3][0-9].json' -size -16M -exec cp {} data/history/snapshots/ \;
          if [ -f history-new/events.json ] && [ "$(stat -c %s history-new/events.json)" -lt 33554432 ]; then
            node -e 'JSON.parse(require("fs").readFileSync("history-new/events.json","utf8"))' && cp history-new/events.json data/history/events.json
          fi
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history
          if git diff --cached --quiet; then echo "no history change"; exit 0; fi
          git commit -m "history: $(date -u +%F)"
          git push origin verify-data
