name: publish-index

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of npm plugins to include
        required: false
        default: '300'
      host:
        description: Host version label for compatibility labels (empty = resolve npm latest)
        required: false
        default: ''
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build format-1 index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A hard-coded label goes stale within days and silently mislabels the whole index, so the
      # host version is resolved from npm at build time unless the caller pinned one.
      - name: Resolve host version
        id: host
        run: |
          if [ -n "${{ inputs.host }}" ]; then
            echo "version=${{ inputs.host }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(npm view @deepseek-ai/dsh version)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build index
        env:
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json
          LIMIT: ${{ inputs.limit || '300' }}
          HOST: ${{ steps.host.outputs.version }}
        run: |
          node bin/dsh-plugin-health.js index \
            --catalog https://awesome-dsh-plugin.com/plugins.json \
            --host "$HOST" \
            --index-url "$INDEX_URL" \
            --limit "$LIMIT" \
            --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
