name: publish-npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm via trusted publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Diagnostics
        run: |
          node --version
          npm --version
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC env present"; else echo "OIDC env MISSING"; fi
          if [ -f "$HOME/.npmrc" ]; then echo "user npmrc exists"; else echo "no user npmrc"; fi
      - name: Probe npm OIDC exchange (same workflow as the trusted publisher)
        continue-on-error: true
        run: |
          set -uo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r '.value')
          echo "oidc_jwt_len=${#TOKEN}"
          CODE=$(curl -sS -m 120 -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-plugin-health)
          echo "EXCHANGE_HTTP=$CODE"
          echo "EXCHANGE_BODY=$(head -c 400 /tmp/exchange.json)"
      - name: Publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
