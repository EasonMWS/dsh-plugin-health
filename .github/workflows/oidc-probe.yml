name: oidc-probe

# Read-only diagnostic. Reproduces npm CLI's exact token-exchange request so the result is
# comparable with `npm publish`. Nothing is published, no version is created, nothing is mutated.
#
# npm CLI does (lib/utils/oidc.js):
#   response = npmFetch.json(new URL('.../token/exchange/package/<escapedName>', registry), {
#     ...opts, [ `//registry.npmjs.org/:_authToken` ]: idToken, method: 'POST',
#   })
# i.e. the GitHub OIDC JWT is sent as the registry auth token (Authorization: Bearer <idToken>),
# and the package name is the npm-escaped name. Our earlier probe used --data '{}' plus a raw
# Bearer header, which the endpoint rejects with 404 regardless of package existence.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          node --version
          npm --version

      - name: Probe npm OIDC exchange (CLI-equivalent)
        continue-on-error: true
        run: |
          set -uo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r '.value')
          echo "oidc_jwt_len=${#TOKEN}"
          echo "jwt_head=$(echo "$TOKEN" | cut -c1-20)..."

          # 1) real package, npm CLI-equivalent request (POST, Bearer = OIDC JWT, no JSON body)
          for attempt in 1 2 3; do
            CODE=$(curl -sS -m 90 -o /tmp/real.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-plugin-health")
            echo "PROBE_REAL attempt=$attempt http=$CODE body=$(head -c 300 /tmp/real.json)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 8
          done

          # 2) control: a name that cannot be registered to this repo
          CODE=$(curl -sS -m 90 -o /tmp/ctrl.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-plugin-health-nonexistent-control-9f3a")
          echo "PROBE_CONTROL http=$CODE body=$(head -c 300 /tmp/ctrl.json)"

          # 3) control: same request without auth
          CODE=$(curl -sS -m 60 -o /tmp/noauth.json -w '%{http_code}' -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-plugin-health")
          echo "PROBE_NOAUTH http=$CODE body=$(head -c 200 /tmp/noauth.json)"

          # 4) registry health controls
          echo "PROBE_REGISTRY_READ http=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' https://registry.npmjs.org/dsh-plugin-health)"
          echo "PROBE_PING http=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' https://registry.npmjs.org/-/ping)"
