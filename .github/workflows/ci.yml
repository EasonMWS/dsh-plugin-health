name: ci

on:
  push:
  pull_request:
  # The official host moves; the compatibility mirror has to be re-checked even when nothing here changed.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The sandbox tests execute real bubblewrap. Without it they skip, and a skipped test reports ok —
      # which is indistinguishable from a passing one in the summary.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Two separate questions, and only one of them is answerable here.
      #
      # bubblewrap must be installed: that is within this workflow's control, and a missing binary means
      # the install step above broke.
      #
      # Whether it can *run* is not: GitHub's ubuntu-latest forbids the user namespaces bubblewrap needs,
      # so the execution tests skip there by design. That skip is correct, and failing on it would make CI
      # red for a working implementation.
      - name: bubblewrap must at least be installed on Linux
        if: runner.os == 'Linux'
        run: |
          command -v bwrap || { echo "::error::bubblewrap is not installed; the step above did not work"; exit 1; }
          node --test test/sandbox.test.js > sandbox.log 2>&1 || true
          if grep -q 'bubblewrap is not installed' sandbox.log; then
            echo "::error::the sandbox module reports bubblewrap as missing"
            exit 1
          fi
          # A skip is allowed, but it has to be the environmental one, with a reason.
          if grep -q 'has no usable sandbox' sandbox.log; then
            echo "::warning::the sandbox execution tests skipped in this image (user namespaces are restricted here)"
          fi
      - run: npm test

  # The runtime job has to follow the host, not a version written here months ago. This job resolves
  # `latest` and `next` from the registry and hands the list to the matrix below, which also keeps the two
  # tags from being written twice when they point at the same release.
  hosts:
    name: resolve runtime host versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.resolve.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        run: echo "list=$(node scripts/resolve-runtime-hosts.mjs)" >> "$GITHUB_OUTPUT"

  pack:
    name: package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run

  # src/compat/evaluate.js is a copy of the host's judgement. A copy that silently diverges makes every
  # verdict wrong, including the published page, and nothing else would notice.
  compat-drift:
    name: compat drift against official app-boot
    # Weekly, on demand, and on a pull request that touches the mirror or its corpus. Not on every push: the
    # official package only changes when the host does.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Working out whether this pull request is one of the relevant ones. The base ref arrives through the
      # environment rather than being pasted into the script.
      - name: is this a change that could drift?
        id: relevant
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(src/compat/evaluate\.js|test/fixtures/compat-corpus\.json)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "neither the mirror nor its corpus changed"
          fi
      - if: steps.relevant.outputs.run == 'true'
        run: npm ci
      - name: install the official builds
        if: steps.relevant.outputs.run == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/app-boot-next" --no-audit --no-fund --no-progress "@deepseek-ai/dsh-app-boot@next"
          npm install --prefix "$RUNNER_TEMP/app-boot-latest" --no-audit --no-fund --no-progress "@deepseek-ai/dsh-app-boot@latest" || true
      - name: compare the mirror against the official implementation
        if: steps.relevant.outputs.run == 'true'
        run: |
          # next must agree. latest is informational: releases before 0.2.2-rc.1 predate the export, and the
          # script reports that rather than failing.
          node scripts/compat-drift.js "$RUNNER_TEMP/app-boot-next"
          node scripts/compat-drift.js "$RUNNER_TEMP/app-boot-latest" || true

  runtime:
    name: runtime acceptance (dsh ${{ matrix.host }})
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: npm ci
      - name: Install official host
        env:
          DSH_HOST_VERSION: ${{ matrix.host }}
        run: npm install --prefix "$RUNNER_TEMP/dsh-host" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_HOST_VERSION"
      - name: Accept healthy fixture and reject broken fixtures
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:runtime -- "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-reports-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/dsh-health-host-acceptance-*/dsh-health-smoke-*/smoke.json
            ${{ runner.temp }}/dsh-health-host-acceptance-*/dsh-health-smoke-*/runtime.json
