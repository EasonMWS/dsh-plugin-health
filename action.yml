name: DSH plugin compatibility matrix
description: Check a DeepSeek Harness (DSH) plugin against several host versions and comment the matrix on the pull request.
author: EasonMWS

branding:
  icon: activity
  color: blue

inputs:
  plugins:
    description: Path to a plugin list file, or a comma-separated list of npm specs.
    required: true
  versions:
    description: Comma-separated host versions or @deepseek-ai/dsh dist-tags.
    required: false
    default: latest,next
  out:
    description: Output directory for matrix.json, matrix.md and badges.
    required: false
    default: dsh-health-matrix
  failOn:
    description: any, none, or one host version; exit non-zero when incompatibilities are found.
    required: false
    default: none

outputs:
  json:
    description: Path to the machine-readable matrix.
    value: ${{ steps.run.outputs.json }}
  markdown:
    description: Path to the ready-to-paste markdown table.
    value: ${{ steps.run.outputs.markdown }}
  incompatible:
    description: Number of incompatible plugin/version pairs found.
    value: ${{ steps.run.outputs.incompatible }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - shell: bash
      run: npm ci --prefix "${{ github.action_path }}"
    # Inputs go through the environment, never straight into the script text. A caller can pass a
    # branch name or a PR title; interpolating that into a shell line would execute it on the runner,
    # and a reusable workflow runs with pull-requests: write.
    - id: run
      shell: bash
      env:
        INPUT_PLUGINS: ${{ inputs.plugins }}
        INPUT_VERSIONS: ${{ inputs.versions }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_FAIL_ON: ${{ inputs.failOn }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -u
        status=0
        node "$ACTION_PATH/bin/dsh-plugin-health.js" matrix \
          --plugins "$INPUT_PLUGINS" \
          --versions "$INPUT_VERSIONS" \
          --out "$INPUT_OUT" \
          --fail-on "$INPUT_FAIL_ON" || status=$?

        # Written before the exit code is honoured: `--fail-on` is meant to fail the job, and with
        # `set -e` (or an early exit) the outputs below would never be set, leaving callers with an
        # empty matrix path exactly when the matrix matters most.
        {
          echo "json=$INPUT_OUT/matrix.json"
          echo "markdown=$INPUT_OUT/matrix.md"
        } >> "$GITHUB_OUTPUT"
        total="$(node -e '
          const fs = require("fs")
          const file = process.argv[1]
          if (!fs.existsSync(file)) { console.log(0); process.exit(0) }
          const m = JSON.parse(fs.readFileSync(file, "utf8"))
          console.log(m.plugins.reduce((n, p) => n + (p.summary?.incompatible ?? 0), 0))
        ' "$INPUT_OUT/matrix.json" 2>/dev/null || echo 0)"
        echo "incompatible=${total:-0}" >> "$GITHUB_OUTPUT"
        exit "$status"